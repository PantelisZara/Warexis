# Local kind images are loaded explicitly; pods never pull application images.
# Aggregate health is public; liveness stays independent of database/Kafka health.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order
  namespace: warexis
  labels:
    app.kubernetes.io/name: order
    app.kubernetes.io/part-of: warexis
spec:
  replicas: 1
  revisionHistoryLimit: 2
  minReadySeconds: 10
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: order
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order
        app.kubernetes.io/part-of: warexis
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: order
        image: warexis/order:p11-14fa97e6
        imagePullPolicy: Never
        ports:
        - name: http
          containerPort: 8081
        resources:
          requests:
            cpu: 150m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        startupProbe:
          httpGet:
            path: /actuator/health
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 90
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          tcpSocket:
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        envFrom:
        - configMapRef:
            name: warexis-config
        env:
        - name: SERVER_PORT
          value: '8081'
        - name: ORDER_DB_URL
          value: jdbc:postgresql://order-postgres:5432/warexis_order
        - name: ORDER_DB_USERNAME
          value: warexis_order
        - name: ORDER_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: warexis-runtime
              key: ORDER_DB_PASSWORD
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: order
  namespace: warexis
  labels:
    app.kubernetes.io/name: order
    app.kubernetes.io/part-of: warexis
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: order
  ports:
  - name: http
    port: 8081
    targetPort: http
---
