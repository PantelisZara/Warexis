# Local single-node stateful dependencies; PVCs survive pod restarts.
# PostgreSQL 18 stores its versioned data below /var/lib/postgresql.
# PostgreSQL retains image entrypoint ownership capabilities; Kafka is UID/GID 1000.
apiVersion: v1
kind: Service
metadata:
  name: order-postgres
  labels:
    app.kubernetes.io/name: order-postgres
    app.kubernetes.io/part-of: warexis
spec:
  selector:
    app.kubernetes.io/name: order-postgres
  ports:
  - name: postgres
    port: 5432
    targetPort: postgres
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: order-postgres
  labels:
    app.kubernetes.io/name: order-postgres
    app.kubernetes.io/part-of: warexis
spec:
  serviceName: order-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: order-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-postgres
        app.kubernetes.io/part-of: warexis
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      containers:
      - name: postgres
        image: postgres:18.6
        ports:
        - name: postgres
          containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: warexis_order
        - name: POSTGRES_USER
          value: warexis_order
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: warexis-runtime
              key: ORDER_DB_PASSWORD
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - CHOWN
            - DAC_OVERRIDE
            - FOWNER
            - SETGID
            - SETUID
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql
        startupProbe:
          exec:
            command:
            - sh
            - -ec
            - pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          timeoutSeconds: 5
          periodSeconds: 10
          failureThreshold: 30
        readinessProbe:
          exec:
            command:
            - sh
            - -ec
            - pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          timeoutSeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          exec:
            command:
            - sh
            - -ec
            - pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          timeoutSeconds: 5
          periodSeconds: 10
          failureThreshold: 6
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: standard
      resources:
        requests:
          storage: 1Gi
---
