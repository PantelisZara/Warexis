server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The frontend uses /api/<service>/api/...; retain the backend /api/ prefix.
    location ^~ /api/order/api/ {
        proxy_pass http://order:8081/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /api/inventory/api/ {
        proxy_pass http://inventory:8082/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /api/fulfillment/api/ {
        proxy_pass http://fulfillment:8083/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Only the public aggregate health endpoint is proxied from management.
    location = /api/order/actuator/health {
        proxy_pass http://order:8081/actuator/health;
    }
    location = /api/inventory/actuator/health {
        proxy_pass http://inventory:8082/actuator/health;
    }
    location = /api/fulfillment/actuator/health {
        proxy_pass http://fulfillment:8083/actuator/health;
    }
    location ^~ /api/ {
        return 404;
    }
    location ^~ /actuator {
        return 404;
    }

    # Frontend navigation routes resolve to the built SPA entry point.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
