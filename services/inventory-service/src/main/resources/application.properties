spring.application.name=warexis-inventory-service

spring.datasource.url=${INVENTORY_DB_URL}
spring.datasource.username=${INVENTORY_DB_USERNAME}
spring.datasource.password=${INVENTORY_DB_PASSWORD}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never

spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.mapper.allow-coercion-of-scalars=false
spring.jackson.deserialization.fail-on-unknown-properties=true

warexis.messaging.enabled=${WAREXIS_MESSAGING_ENABLED:false}
warexis.messaging.retry-base-delay=1s
warexis.messaging.poll-interval=250ms
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.max-poll-records=1
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.ByteArraySerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.ByteArraySerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=0
spring.kafka.producer.properties.enable.idempotence=false
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.max.block.ms=10000
spring.kafka.listener.ack-mode=manual_immediate
spring.kafka.listener.concurrency=3

# Issuer and API audience are required; no insecure local fallback.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${WAREXIS_OAUTH2_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.audiences=${WAREXIS_OAUTH2_AUDIENCE}

# Fixed service identity; request latency buckets support server-side percentile queries.
management.metrics.enable.disk=false
management.metrics.tags.service=inventory
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Native Kafka observations remain off; explicit attempts preserve the existing timers.
spring.kafka.template.observation-enabled=false
spring.kafka.listener.observation-enabled=false

# Traces are opt-in; metrics and logs keep their existing local/export behavior.
management.tracing.sampling.probability=${WAREXIS_TRACING_SAMPLING_PROBABILITY:0.1}
management.tracing.export.otlp.enabled=${WAREXIS_TRACING_EXPORT_ENABLED:false}
management.logging.export.otlp.enabled=false
management.otlp.metrics.export.enabled=false
management.opentelemetry.map-environment-variables=false
management.opentelemetry.tracing.export.max-queue-size=16
management.opentelemetry.tracing.export.max-batch-size=4
management.opentelemetry.tracing.export.schedule-delay=50ms
management.opentelemetry.tracing.export.timeout=500ms
management.opentelemetry.tracing.export.otlp.transport=http
management.opentelemetry.tracing.export.otlp.endpoint=${WAREXIS_OTLP_ENDPOINT:http://127.0.0.1:4318/v1/traces}
management.opentelemetry.tracing.export.otlp.timeout=250ms
management.opentelemetry.tracing.export.otlp.connect-timeout=100ms
