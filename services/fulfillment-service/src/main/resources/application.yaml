server:
  address: ${FULFILLMENT_HTTP_ADDRESS:127.0.0.1}
  port: ${FULFILLMENT_HTTP_PORT:8083}
spring:
  application:
    name: warexis-fulfillment-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${WAREXIS_OAUTH2_ISSUER_URI}
          audiences: ${WAREXIS_OAUTH2_AUDIENCE}
  jackson:
    mapper:
      allow-coercion-of-scalars: false
    deserialization:
      accept-float-as-int: false
  datasource:
    url: ${FULFILLMENT_DB_URL}
    username: ${FULFILLMENT_DB_USERNAME}
    password: ${FULFILLMENT_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

warexis:
  messaging:
    enabled: ${WAREXIS_MESSAGING_ENABLED:false}
    retry-base-delay: ${WAREXIS_MESSAGING_RETRY_BASE_DELAY:1s}
    poll-interval: ${WAREXIS_MESSAGING_POLL_INTERVAL:250ms}

management:
  metrics:
    enable:
      disk: false
    tags:
      service: fulfillment
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
