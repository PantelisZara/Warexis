spring:
  application:
    name: warexis-order-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${WAREXIS_OAUTH2_ISSUER_URI}
          audiences: ${WAREXIS_OAUTH2_AUDIENCE}
  jackson:
    mapper:
      allow-coercion-of-scalars: false
    deserialization:
      accept-float-as-int: false
  datasource:
    url: ${ORDER_DB_URL}
    username: ${ORDER_DB_USERNAME}
    password: ${ORDER_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

warexis:
  messaging:
    enabled: ${WAREXIS_MESSAGING_ENABLED:false}
    retry-base-delay: ${WAREXIS_MESSAGING_RETRY_BASE_DELAY:1s}
    poll-interval: ${WAREXIS_MESSAGING_POLL_INTERVAL:250ms}

management:
  tracing:
    sampling:
      probability: ${WAREXIS_TRACING_SAMPLING_PROBABILITY:0.1}
    export:
      otlp:
        enabled: ${WAREXIS_TRACING_EXPORT_ENABLED:false}
  logging:
    export:
      otlp:
        enabled: false
  otlp:
    metrics:
      export:
        enabled: false
  opentelemetry:
    map-environment-variables: false
    tracing:
      export:
        max-queue-size: 16
        max-batch-size: 4
        schedule-delay: 50ms
        timeout: 500ms
        otlp:
          transport: http
          endpoint: ${WAREXIS_OTLP_ENDPOINT:http://127.0.0.1:4318/v1/traces}
          timeout: 250ms
          connect-timeout: 100ms
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    enable:
      disk: false
    tags:
      service: order
    distribution:
      percentiles-histogram:
        http.server.requests: true
