spring:
  application:
    name: warexis-order-service
  jackson:
    mapper:
      allow-coercion-of-scalars: false
    deserialization:
      accept-float-as-int: false
  datasource:
    url: ${ORDER_DB_URL}
    username: ${ORDER_DB_USERNAME}
    password: ${ORDER_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

warexis:
  messaging:
    enabled: ${WAREXIS_MESSAGING_ENABLED:false}
    retry-base-delay: ${WAREXIS_MESSAGING_RETRY_BASE_DELAY:1s}
    poll-interval: ${WAREXIS_MESSAGING_POLL_INTERVAL:250ms}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
