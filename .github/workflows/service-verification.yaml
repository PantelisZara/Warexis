name: Service verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify ${{ matrix.service }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [order-service, inventory-service, fulfillment-service]
    defaults:
      run:
        shell: bash
        working-directory: services/${{ matrix.service }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-jdk: false
          cache-dependency-path: |
            services/${{ matrix.service }}/pom.xml
            services/${{ matrix.service }}/.mvn/wrapper/maven-wrapper.properties

      - name: Verify service
        run: ./mvnw --batch-mode --no-transfer-progress verify

  workflow:
    name: Verify Keycloak security and authenticated Kafka workflow
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-jdk: false
          cache-dependency-path: |
            services/order-service/pom.xml
            services/inventory-service/pom.xml
            services/fulfillment-service/pom.xml
            tests/workflow/pom.xml
            services/order-service/.mvn/wrapper/maven-wrapper.properties
      - name: Verify packaged service workflow
        run: scripts/verify-workflow.sh
      - name: Show service diagnostics on failure
        if: failure()
        run: |
          for service in order inventory fulfillment; do
            if [ -f "tests/workflow/target/$service.log" ]; then
              tail -n 100 "tests/workflow/target/$service.log"
            fi
          done
