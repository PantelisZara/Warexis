name: warexis-local

services:
  order-postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ORDER_POSTGRES_DB:-warexis_order}
      POSTGRES_USER: ${ORDER_POSTGRES_USER:-warexis_order}
      POSTGRES_PASSWORD: ${ORDER_POSTGRES_PASSWORD:?Set ORDER_POSTGRES_PASSWORD for local development}
    ports:
      - "127.0.0.1:${ORDER_POSTGRES_PORT:-15432}:5432"
    volumes:
      - order-postgres-data:/var/lib/postgresql
    networks:
      - local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  inventory-postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${INVENTORY_POSTGRES_DB:-warexis_inventory}
      POSTGRES_USER: ${INVENTORY_POSTGRES_USER:-warexis_inventory}
      POSTGRES_PASSWORD: ${INVENTORY_POSTGRES_PASSWORD:?Set INVENTORY_POSTGRES_PASSWORD for local development}
    ports:
      - "127.0.0.1:${INVENTORY_POSTGRES_PORT:-15433}:5432"
    volumes:
      - inventory-postgres-data:/var/lib/postgresql
    networks:
      - local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  fulfillment-postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${FULFILLMENT_POSTGRES_DB:-warexis_fulfillment}
      POSTGRES_USER: ${FULFILLMENT_POSTGRES_USER:-warexis_fulfillment}
      POSTGRES_PASSWORD: ${FULFILLMENT_POSTGRES_PASSWORD:?Set FULFILLMENT_POSTGRES_PASSWORD for local development}
    ports:
      - "127.0.0.1:${FULFILLMENT_POSTGRES_PORT:-15434}:5432"
    volumes:
      - fulfillment-postgres-data:/var/lib/postgresql
    networks:
      - local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  keycloak-postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KEYCLOAK_POSTGRES_DB:-warexis_identity}
      POSTGRES_USER: ${KEYCLOAK_POSTGRES_USER:-warexis_identity}
      POSTGRES_PASSWORD: ${KEYCLOAK_POSTGRES_PASSWORD:?Set KEYCLOAK_POSTGRES_PASSWORD for local development}
    volumes:
      - keycloak-postgres-data:/var/lib/postgresql
    networks:
      - local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/${KEYCLOAK_POSTGRES_DB:-warexis_identity}
      KC_DB_USERNAME: ${KEYCLOAK_POSTGRES_USER:-warexis_identity}
      KC_DB_PASSWORD: ${KEYCLOAK_POSTGRES_PASSWORD:?Set KEYCLOAK_POSTGRES_PASSWORD for local development}
      KC_HOSTNAME: http://127.0.0.1:${KEYCLOAK_HTTP_PORT:-18080}
      KC_BOOTSTRAP_ADMIN_CLIENT_ID: ${KEYCLOAK_BOOTSTRAP_ADMIN_CLIENT_ID:-warexis-bootstrap-admin}
      KC_BOOTSTRAP_ADMIN_CLIENT_SECRET: ${KEYCLOAK_BOOTSTRAP_ADMIN_CLIENT_SECRET:?Set a random local bootstrap service-account secret}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    ports:
      - "127.0.0.1:${KEYCLOAK_HTTP_PORT:-18080}:8080"
    volumes:
      - ./infrastructure/auth/warexis-realm.json:/opt/keycloak/data/import/warexis-realm.json:ro
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    networks:
      - local
    healthcheck:
      test: ["CMD", "bash", "-ec", "{ printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0; grep -q 'HTTP/1.0 200'; } 0<>/dev/tcp/127.0.0.1/9000"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s

  kafka:
    image: apache/kafka:4.2.2
    restart: unless-stopped
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-4L6g3nShT-eMCtK--X86sw}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://127.0.0.1:${KAFKA_HOST_PORT:-19092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:-19092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    # These unused image-declared volumes need no persistent local storage.
    tmpfs:
      - /etc/kafka/secrets
      - /mnt/shared/config
    networks:
      - local
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:29092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s

networks:
  local:
    driver: bridge

volumes:
  order-postgres-data:
  inventory-postgres-data:
  fulfillment-postgres-data:
  kafka-data:
  keycloak-postgres-data:
